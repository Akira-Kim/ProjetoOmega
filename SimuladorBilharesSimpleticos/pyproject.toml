[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bilhar-simpletico"
version = "0.1.0"
description = "Simulador interativo de bilhares elásticos e simpléticos com visualização em tempo real"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
bilhar = "bilhar.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bilhar*"]
